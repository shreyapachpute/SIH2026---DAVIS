version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: davis-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-davis_secure_password_example}
      MYSQL_DATABASE: ${DB_NAME:-davis_db}
      MYSQL_USER: ${DB_USER:-davis_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-davis_secure_password_example}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - davis_mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-davis_secure_password_example}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - davis-network

  backend:
    build:
      context: .
      dockerfile: deployment/Dockerfile.backend
    container_name: davis-backend
    restart: always
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-davis_db}
      DB_USER: ${DB_USER:-davis_user}
      DB_PASSWORD: ${DB_PASSWORD:-davis_secure_password_example}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - davis-network

  frontend:
    build:
      context: .
      dockerfile: deployment/Dockerfile.frontend
    container_name: davis-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - davis-network

networks:
  davis-network:
    driver: bridge

volumes:
  davis_mysql_data:
