# ==============================================================================
# DAVIS Spring Boot Configuration (Default / Development)
# ==============================================================================
spring.application.name=davis-backend
server.port=${SERVER_PORT:8080}

# Database Configuration (H2 memory database for instant zero-config startup)
spring.datasource.url=jdbc:h2:mem:davis_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console (for debugging / inspection)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Serve static frontend directly from the backend if desired
spring.web.resources.static-locations=classpath:/static/,file:../frontend/,file:./frontend/

# File upload / limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Logging
logging.level.com.davis=INFO
logging.level.org.springframework.web=INFO
