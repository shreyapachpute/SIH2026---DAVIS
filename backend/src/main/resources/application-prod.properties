# ==============================================================================
# DAVIS Spring Boot Configuration (Production / MySQL / Docker)
# ==============================================================================
server.port=${SERVER_PORT:8080}

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:davis_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:davis_user}
spring.datasource.password=${DB_PASSWORD:davis_secure_password_example}

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Static resources
spring.web.resources.static-locations=classpath:/static/,file:/usr/share/nginx/html/,file:../frontend/

# Logging
logging.level.com.davis=INFO
logging.level.org.springframework.web=WARN
